name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build and run tests
        run: |
          mkdir -p build
          xcodebuild test \
            -project TrackKar.xcodeproj \
            -scheme TrackKar \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            | tee build/xcodebuild.log
          exit ${PIPESTATUS[0]}

      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore
